name: Build Engine

on:
  push:
    # Trigger on pushes to the main branch
    branches: [main]
  pull_request:
  # Trigger on any pull request
  workflow_dispatch:
  # Allow manual workflow runs with branch selector

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # Make sure the selected ref/branch is checked out
          ref: ${{ github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          chmod +x ./Scripts/setup.sh
          ./Scripts/setup.sh

      - name: Compile
        run: ./Scripts/build.sh

      - name: Package artifact
        run: |
          mkdir -p artifacts
          # Replace ./build/ with the directory where your build outputs go
          tar -czvf artifacts/engine-${{ github.run_number }}.tar.gz ./build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-artifacts
          path: artifacts/
